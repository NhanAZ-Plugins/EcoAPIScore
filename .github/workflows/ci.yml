name: Validate and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out EcoAPIScore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out EcoAPI virion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NhanAZ-Libraries/EcoAPI
          ref: 343aef3606da1bc16d006799b27914cc8ff31d17 # v1.0.0
          path: virions/EcoAPI
          persist-credentials: false

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Set up PHP
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0 # 3.2.0
        with:
          php-version: 8.4
          pm-version-major: 5
          install-path: ./.php-bin

      - name: Validate and install Composer dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins --ignore-platform-req=ext-webrtc

      - name: Run tests
        run: composer test

      - name: Lint PHP source and tests
        shell: bash
        run: find src stubs tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPStan level max
        run: composer phpstan

      - name: Build PHAR with DevTools
        id: build
        uses: AxolotlBucketLabs/DevTools@v3 # v3.0.0
        with:
          project: .
          virions: virions
          output: build
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm
          phpstan-paths: stubs

      - name: Verify PHAR
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
        run: |
          set -euo pipefail
          test -s "$PHAR_PATH"
          php -r '$p = new Phar(getenv("PHAR_PATH")); foreach(["plugin.yml","resources/config.yml","src/NhanAZ/EcoAPIScore/Main.php","src/NhanAZ/EcoAPIScore/util/BalanceFormatter.php"] as $f){if(!$p->offsetExists($f)){throw new RuntimeException("Missing PHAR entry: ".$f);}} $plugin = $p["plugin.yml"]->getContent(); if(!preg_match("/^name:\\s*EcoAPIScore\\s*$/m", $plugin) || !preg_match("/^version:\\s*1\\.0\\.0\\s*$/m", $plugin)){throw new RuntimeException("Unexpected plugin metadata");} $found = false; foreach(new RecursiveIteratorIterator($p) as $file){if(str_contains($file->getPathName(), "/src/NhanAZ/EcoAPIScore/_DevTools/EcoAPI_")){ $found = true; break; }} if(!$found){throw new RuntimeException("Missing shaded EcoAPI");}'

      - name: Upload PHAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EcoAPIScore-${{ github.sha }}
          path: ${{ steps.build.outputs.phar }}
          if-no-files-found: error
